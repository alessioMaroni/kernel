name: Kernel Quality Gate & Formal Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  TARGET_ARCH: "riscv32imac-unknown-none-elf"
  CARGO_FEATURE: "rp2350"

jobs:
  verify:
    name: Verification & Safety Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Repository
        uses: actions/checkout@v4

      - name: Checkout HAL Repository
        uses: actions/checkout@v4
        with:
          repository: alessioMaroni/rp2350-hazard3-hal
          path: rp2350-hazard3-hal

      - name: Link HAL Dependency
        run: ln -s $GITHUB_WORKSPACE/rp2350-hazard3-hal ../rp2350-hazard3-hal

      - name: Install Clang & RISC-V Cross Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev gcc-riscv64-unknown-elf

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.TARGET_ARCH }}
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 1. Code Formatting Check
        run: cargo fmt --check

      - name: 2. Static Analysis & Strict Linting (Clippy)
        run: cargo clippy --target ${{ env.TARGET_ARCH }} --features ${{ env.CARGO_FEATURE }} -- -D warnings

      - name: 3. Kernel Compilation Check (Bare-Metal RISC-V)
        run: cargo check --target ${{ env.TARGET_ARCH }} --features ${{ env.CARGO_FEATURE }}

      - name: 4. Unsafe Code Boundary Audit
        run: |
          echo "Auditing kernel core for unauthorized unsafe blocks..."
          UNSAFE_COUNT=$(grep -rnE "unsafe \{" src/ | grep -v "src/setup.rs" | grep -v "src/panic.rs" | grep -v "src/boards/" | wc -l)
          if [ "$UNSAFE_COUNT" -gt 0 ]; then
            echo "ERROR: Found unauthorized unsafe code outside bootstrap modules!"
            grep -rnE "unsafe \{" src/ | grep -v "src/setup.rs" | grep -v "src/panic.rs" | grep -v "src/boards/"
            exit 1
          fi
          echo "Unsafe boundary check passed successfully."