[alias]
b = "build"
bj = "build -j 3"
c = "check"
cf = "check --features"
cl = "clippy"
clf = "clippy --features"
cln = "clean"
r = "run"
rr = "run --release"

[build]
target = "riscv32imac-unknown-none-elf"
jobs = 1
# rustc-wrapper = "sccache"
rustdocflags = ["--deny-warnings"]
incremental = false
[unstable]
build-std = ["core"]

[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip RP2350"
rustflags = [
    "-D", "warnings",
    "-C", "panic=abort",
    "-C", "overflow-checks=on",
    "-C", "force-frame-pointers=yes",
    "-C", "llvm-args=-trap-unreachable",
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=--nmagic",
]

[env]
CC_riscv32imac_unknown_none_elf = "riscv-none-elf-gcc"
CFLAGS_riscv32imac_unknown_none_elf = "-march=rv32imac -mabi=ilp32"